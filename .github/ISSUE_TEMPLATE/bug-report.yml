name: 不具合の報告
description: |
  不具合を報告するときに使います。
  不具合かどうか分からないときは、「困りごとの相談」を使ってください。
labels:
  - bug
body:
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: |
        このリポジトリのコマンドはすべて Docker コンテナの中で `just` から動きます（ホストに Go は要りません）。
        再現したコミット、`go.mod` の `go` と `go.temporal.io/sdk` の行、`docker --version`、`just --version`、OS を貼ってください。
        ライブラリとして使っていて困っているときは、利用側の `go.mod` にある temporal-workflow-kit と Temporal SDK のバージョン、
        つないでいる Temporal サーバの種類と版（Cloud、自前、`temporal server start-dev` など）を書いてください。
        複数の版で試したときは、その結果も書いてください。例: 最新の main では起きるが、以前のコミットでは起きない。
      placeholder: |
        ```console
        $ git rev-parse HEAD
        $ grep -E '^go |go.temporal.io/sdk ' go.mod
        $ docker --version
        $ just --version
        ```
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: 再現手順
      description: |
        他の人が同じ結果になるところまで書いてください。
        不要な部分は削って、起きる最小の形にしてください。
        `just test`、`just spec` など、打ったコマンドと出力をそのまま貼ってください。
        仕様（`docs/specs/`）が落ちるときは、`just spec -run 'TestFeatures/<シナリオ名>'` の出力と、
        `just spec-ui` で読めるワークフロー履歴（イベントの並び）があると原因を追いやすくなります。
      value: |
        手順

        1. 

        関連するコード（ワークフロー、アクティビティ、設定など）

        ```go

        ```

        打ったコマンドと出力

        ```console
        $ 
        ```
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual-behaviour
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 補足
    validations:
      required: false
